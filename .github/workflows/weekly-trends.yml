name: Weekly trends pipeline

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

concurrency:
  group: weekly-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret이 없습니다. Settings > Secrets and variables > Actions 에 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install -g @anthropic-ai/claude-code

      - name: Run cc-trends pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          claude \
            --dangerously-skip-permissions \
            -p "cc-trends 주간 파이프라인 실행. 5명 에이전트 팀으로 GitHub과 개발자 커뮤니티에서 이번 주 데이터를 수집·분석·큐레이션하고 site/public/data/latest.json을 업데이트한 뒤 완료 보고만 해."

      - name: Post-process (RSS · archive · OG)
        run: |
          node scripts/generate-rss.js || echo "::warning::RSS generation failed (continuing)"
          mkdir -p site/public/data/archive
          cp -n data/archive/*.json site/public/data/archive/ 2>/dev/null || true
          node scripts/build-archive-index.js || echo "::warning::archive index gen failed (continuing)"
          node scripts/generate-og.js || echo "::warning::OG generation failed (continuing)"

      - name: Commit & push
        run: |
          git config user.name "weeklaude-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data data/archive site/feed.xml site/og.svg site/og.png
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Weekly update · $(date +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi

  # GITHUB_TOKEN 으로 push 한 커밋은 deploy-pages.yml 을 트리거하지 않으므로 여기서 직접 배포
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
