name: Weekly trends pipeline

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

concurrency:
  group: weekly-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret이 없습니다. https://aistudio.google.com/apikey 에서 발급 후 Settings > Secrets and variables > Actions 에 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect (GitHub + HN, deterministic)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plugins/collect.js

      - name: Curate (Gemini free tier)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/plugins/curate.js

      - name: Post-process (RSS · archive · OG)
        run: |
          node scripts/core/generate-rss.js || echo "::warning::RSS generation failed (continuing)"
          mkdir -p site/public/data/archive
          cp -n data/archive/*.json site/public/data/archive/ 2>/dev/null || true
          node scripts/core/build-archive-index.js || echo "::warning::archive index gen failed (continuing)"
          node scripts/core/generate-og.js || echo "::warning::OG generation failed (continuing)"

      - name: Commit & push
        run: |
          git config user.name "weeklaude-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data data/archive site/feed.xml site/og.svg site/og.png
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Weekly update · $(date +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi

  # GITHUB_TOKEN 으로 push 한 커밋은 deploy-pages.yml 을 트리거하지 않으므로 여기서 직접 배포
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
