name: Collect Stars

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: "stars-collection"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit_push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Collect Stars
        run: node scripts/stars/collect-stars.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: commit_push
        name: Commit and Push
        run: |
          git config user.name "ldk-hub"
          git config user.email "ldk-hub@users.noreply.github.com"
          if git diff --stat data/ site/public/data/ | grep -q "changed"; then
            git add data/ site/public/data/
            git commit -m "chore(stars): daily collect $(date +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN 으로 push 한 커밋은 deploy-pages.yml 을 트리거하지 않으므로 여기서 직접 배포
  deploy:
    needs: collect
    if: needs.collect.outputs.pushed == 'true'
    concurrency:
      group: "pages-stars"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
