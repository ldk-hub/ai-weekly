name: Daily News Pipeline

on:
  schedule:
    - cron: '30 23 * * *' # 매일 23:30 UTC = 08:30 KST (출근 전 자동 갱신)
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret이 없습니다. Settings > Secrets and variables > Actions 에 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect News (7 sources)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/news/collect_news.js

      - name: Curate News (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/news/curate_news.js

      - name: Validate Curation
        run: node scripts/news/curate_news.js --validate

      - name: Post-process (RSS & Sitemap)
        run: node scripts/core/generate-rss.js || echo "::warning::RSS generation failed"

      - name: Commit & push
        run: |
          git config user.name "ldk-hub"
          git config user.email "ldk-hub@users.noreply.github.com"
          git add site/public/data data/archive site/public/news-feed.xml site/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "chore(news): daily update $(date +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Send Dooray Notification
        env:
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_URL }}
        run: node scripts/core/notify-dooray.js

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
