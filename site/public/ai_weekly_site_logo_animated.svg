<svg width="680" height="170" viewBox="0 0 680 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Google Gemini Official Gradient -->
    <linearGradient id="site-gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="35%" stop-color="#9B72CB"/>
      <stop offset="70%" stop-color="#D96570"/>
      <stop offset="100%" stop-color="#1BA1E3"/>
    </linearGradient>

    <style>
      @keyframes floatAnimSite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes geminiPulseSite {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          filter: drop-shadow(0 0 6px rgba(66, 133, 244, 0.4));
        }
        50% {
          transform: scale(1.15) rotate(8deg);
          filter: drop-shadow(0 0 14px rgba(155, 114, 203, 0.8));
        }
      }

      @keyframes chatgptSpinSite {
        0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 6px rgba(16, 163, 127, 0.4)); }
        50% { transform: scale(1.1) rotate(180deg); filter: drop-shadow(0 0 14px rgba(16, 163, 127, 0.8)); }
        100% { transform: scale(1) rotate(360deg); filter: drop-shadow(0 0 6px rgba(16, 163, 127, 0.4)); }
      }

      .mascot-site-float {
        animation: floatAnimSite 3.2s ease-in-out infinite;
      }
      .gemini-site-motion {
        transform-origin: 0px 0px;
        animation: geminiPulseSite 2.8s ease-in-out infinite;
      }
      .chatgpt-site-motion {
        transform-origin: 0px 0px;
        animation: chatgptSpinSite 12s linear infinite;
      }
    </style>
  </defs>

  <!-- LAYER 1: POSITION ANCHOR (115, 105) -->
  <g transform="translate(115, 105)">
    <!-- LAYER 2: SCALE FACTOR (0.48) -->
    <g transform="scale(0.48)">
      <!-- LAYER 3: CSS TRANSLATEY ANIMATION ONLY -->
      <g class="mascot-site-float">
        
        <!-- 4 LEGS -->
        <rect x="-100" y="60" width="20" height="40" fill="#B95B3D"/>
        <rect x="-60" y="60" width="20" height="40" fill="#D97757"/>
        <rect x="40" y="60" width="20" height="40" fill="#D97757"/>
        <rect x="80" y="60" width="20" height="40" fill="#B95B3D"/>

        <!-- MAIN BODY -->
        <rect x="-120" y="-100" width="240" height="160" fill="#D97757"/>
        <rect x="-120" y="-100" width="240" height="20" fill="#E58768"/>
        <rect x="-120" y="40" width="240" height="20" fill="#B95B3D"/>

        <!-- RAISED ARMS -->
        <rect x="-140" y="-40" width="20" height="40" fill="#D97757"/>
        <rect x="-160" y="-60" width="20" height="40" fill="#E58768"/>
        <rect x="-160" y="-80" width="20" height="20" fill="#E58768"/>

        <rect x="120" y="-40" width="20" height="40" fill="#D97757"/>
        <rect x="140" y="-60" width="20" height="40" fill="#E58768"/>
        <rect x="140" y="-80" width="20" height="20" fill="#E58768"/>

        <!-- STOIC EYES -->
        <rect x="-60" y="-40" width="20" height="40" fill="#2B2523"/>
        <rect x="40" y="-40" width="20" height="40" fill="#2B2523"/>

        <!-- GEMINI LOGO -->
        <g transform="translate(-150, -145)">
          <g class="gemini-site-motion">
            <path transform="translate(-60, -60) scale(5.0)" 
                  d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" 
                  fill="url(#site-gemini-grad)"/>
          </g>
        </g>

        <!-- CHATGPT LOGO -->
        <g transform="translate(150, -145)">
          <g class="chatgpt-site-motion">
            <path transform="translate(-60, -60) scale(5.0)" 
                  d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z" 
                  fill="#10A37F"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT: "AI WEEKLY" BRAND TYPOGRAPHY -->
  <g transform="translate(240, 92)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">
      AI <tspan fill="#D97757">WEEKLY</tspan>
    </text>

    <!-- Subtitle / Live Badge -->
    <g transform="translate(2, 32)">
      <rect x="0" y="-18" width="194" height="26" rx="6" fill="#1C1F2B" stroke="#2D3347" stroke-width="1.2"/>
      <circle cx="14" cy="-5" r="4.5" fill="#10A37F"/>
      <text x="26" y="-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9BA1B0">
        AI RADAR &amp; PULSE
      </text>
    </g>
  </g>
</svg>
