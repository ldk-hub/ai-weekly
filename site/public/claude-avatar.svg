<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58A6C"/>
      <stop offset="100%" stop-color="#C86546"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24272E"/>
      <stop offset="100%" stop-color="#181A1F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse-code {
      0%, 100% { opacity: 0.85; transform: scaleX(1); }
      50% { opacity: 1; transform: scaleX(1.03); }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes eye-sparkle {
      0%, 94%, 98% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes head-groove {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-1.5px) rotate(-1deg); }
      66% { transform: translateY(0.5px) rotate(1deg); }
    }
    @keyframes tap-left {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(2.5px) rotate(6deg); }
    }
    @keyframes tap-right {
      0%, 100% { transform: translateY(0) rotate(4deg); }
      50% { transform: translateY(2.5px) rotate(-6deg); }
    }
    @keyframes spark-float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-3px) scale(1.25); opacity: 1; }
    }

    .head-group { animation: head-groove 2.4s infinite ease-in-out; }
    .eyes { transform-origin: 50px 68px; animation: eye-sparkle 3.6s infinite; }
    .cursor { animation: cursor-blink 0.8s infinite; }
    .code-stream { animation: pulse-code 2s infinite ease-in-out; transform-origin: left; }
    .hand-l { transform-origin: 28px 78px; animation: tap-left 0.16s infinite ease-in-out; }
    .hand-r { transform-origin: 72px 78px; animation: tap-right 0.18s infinite ease-in-out; }
    .sparkle { animation: spark-float 2s infinite ease-in-out; }
  </style>

  <!-- 상단 앤트로픽 AI 안테나 스파크 별 -->
  <g class="sparkle" transform="translate(76, 6)">
    <path d="M0,4 L1.5,1.5 L4,0 L1.5,-1.5 L0,-4 L-1.5,-1.5 L-4,0 L-1.5,1.5 Z" fill="#FFB74D"/>
  </g>

  <!-- 머리 & 터미널 그룹 -->
  <g class="head-group">
    <!-- 터미널 창 배경 -->
    <rect x="14" y="9" width="72" height="44" rx="6" fill="url(#termGrad)" filter="url(#shadow)" stroke="#383D47" stroke-width="1"/>
    <!-- 터미널 상단 타이틀바 -->
    <path d="M14 15 a6 6 0 0 1 6 -6 h60 a6 6 0 0 1 6 6 v6 h-72 v-6 z" fill="#282C34"/>
    <!-- 창 제어 삼색 버튼 -->
    <circle cx="21" cy="15" r="2.5" fill="#FF5F56"/>
    <circle cx="28" cy="15" r="2.5" fill="#FFBD2E"/>
    <circle cx="35" cy="15" r="2.5" fill="#27C93F"/>
    <!-- 터미널 탭 타이틀 -->
    <text x="50" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="6" fill="#8A919E" font-weight="600" text-anchor="middle">ai-weekly</text>

    <!-- 터미널 내부 CLI 프롬프트 & 입력 라인 -->
    <text x="19" y="27" font-family="monospace" font-size="7.5" fill="#D97757" font-weight="bold">❯</text>
    <rect x="26" y="22" width="22" height="4" rx="2" fill="#61AFEF"/>
    <rect x="50" y="21.5" width="2" height="5" fill="#D97757" class="cursor"/>

    <!-- 코드 출력 스트림 라인들 -->
    <g class="code-stream">
      <rect x="19" y="30" width="46" height="3.5" rx="1.75" fill="#98C379"/>
      <rect x="19" y="36.5" width="32" height="3.5" rx="1.75" fill="#E5C07B"/>
      <rect x="54" y="36.5" width="16" height="3.5" rx="1.75" fill="#C678DD"/>
      <rect x="19" y="43" width="26" height="3.5" rx="1.75" fill="#56B6C2"/>
    </g>

    <!-- 캐릭터 몸체 (둥글고 세련된 테라코타 로봇) -->
    <rect x="28" y="56" width="44" height="28" rx="8" fill="url(#bodyGrad)" filter="url(#shadow)"/>
    <!-- 귀여운 사이드 센서 귀 -->
    <rect x="25" y="63" width="4" height="9" rx="2" fill="#B95838"/>
    <rect x="71" y="63" width="4" height="9" rx="2" fill="#B95838"/>

    <!-- 얼굴 표정 (초롱초롱한 눈 & 미소) -->
    <g class="eyes">
      <!-- 왼쪽 눈 -->
      <circle cx="41" cy="68" r="3.2" fill="#1E1E1E"/>
      <circle cx="42" cy="67" r="1.1" fill="#FFFFFF"/>
      <!-- 오른쪽 눈 -->
      <circle cx="59" cy="68" r="3.2" fill="#1E1E1E"/>
      <circle cx="60" cy="67" r="1.1" fill="#FFFFFF"/>
      <!-- 귀여운 미소 입 -->
      <path d="M47 74 Q50 77 53 74" fill="none" stroke="#682914" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 세련된 슬림 키보드 -->
  <g transform="translate(0, -1)">
    <rect x="16" y="82" width="68" height="13" rx="4" fill="#2D3139" stroke="#424754" stroke-width="0.8"/>
    <!-- 키캡 라인 (키보드 입체감) -->
    <path d="M20 86 h60 M20 90 h60" stroke="#4F5666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3.5 2"/>
    <!-- 스페이스바 포인트 -->
    <rect x="38" y="91" width="24" height="2" rx="1" fill="#D97757" opacity="0.85"/>
  </g>

  <!-- 둥글둥글한 모찌손 타건 애니메이션 -->
  <ellipse cx="30" cy="80" rx="5" ry="3.5" fill="#EAA48E" stroke="#C86546" stroke-width="0.8" class="hand-l"/>
  <ellipse cx="70" cy="80" rx="5" ry="3.5" fill="#EAA48E" stroke="#C86546" stroke-width="0.8" class="hand-r"/>
</svg>
